<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050a18"
    >

    <title>Bloom — A Little Garden</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         INTRO SCREEN
    =========================================== -->

    <section id="introScreen" class="intro-screen">

        <div class="stars intro-stars"></div>

        <div class="intro-moon">
            <div class="moon-shadow"></div>
        </div>

        <div class="intro-content">

            <p class="eyebrow">
                A QUIET PLACE
            </p>

            <h1>
                Bloom
            </h1>

            <p class="intro-subtitle">
                A Little Garden
            </p>

            <p class="intro-description">
                A small garden waiting for you.
                <br>
                Plant a flower and let it bloom.
            </p>

            <button
                id="enterGarden"
                class="enter-button"
            >
                <span>Enter the Garden</span>
                <span class="button-arrow">→</span>
            </button>

        </div>

    </section>


    <!-- ==========================================
         GARDEN SCREEN
    =========================================== -->

    <section
        id="gardenScreen"
        class="garden-screen hidden"
    >

        <!-- Night sky -->

        <div class="stars garden-stars"></div>

        <div class="small-cloud cloud-one"></div>
        <div class="small-cloud cloud-two"></div>

        <!-- Moon -->

        <div class="garden-moon">
            <div class="garden-moon-shadow"></div>
        </div>


        <!-- ======================================
             HEADER
        ======================================= -->

        <header class="garden-header">

            <p class="garden-label">
                YOUR LITTLE GARDEN
            </p>

            <h2>
                Let it bloom.
            </h2>

            <p class="garden-instruction">
                Tap anywhere on the ground
            </p>

        </header>


        <!-- ======================================
             GARDEN
        ======================================= -->

        <main
            id="garden"
            class="garden"
        >

            <!-- Soft light near horizon -->

            <div class="ground-light"></div>


            <!-- ==================================
                 BACK GRASS
            =================================== -->

            <div class="back-grass"></div>


            <!-- ==================================
                 FLOWERS
            =================================== -->

            <div
                id="flowerLayer"
                class="flower-layer"
            ></div>


            <!-- ==================================
                 PLANTING AREA

                 IMPORTANT:
                 This transparent layer only covers
                 the actual grass area.

                 Therefore you cannot plant in the sky.
            =================================== -->

            <div
                id="plantZone"
                class="plant-zone"
                aria-label="Planting ground"
            ></div>


            <!-- ==================================
                 FIREFLIES
            =================================== -->

            <div class="fireflies">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- ==================================
                 FRONT GRASS
            =================================== -->

            <div class="front-grass"></div>


            <!-- ==================================
                 BUTTERFLY
            =================================== -->

            <div class="butterfly">

                <div class="butterfly-wing wing-left"></div>

                <div class="butterfly-body"></div>

                <div class="butterfly-wing wing-right"></div>

            </div>


            <!-- ==================================
                 BOTTOM UI
            =================================== -->

            <div class="garden-ui">

                <div
                    id="flowerCounter"
                    class="flower-counter"
                >
                    <span id="countNumber">0</span>
                    <span id="countText">blooms</span>
                </div>

                <button
                    id="clearBtn"
                    class="clear-button"
                >
                    Clear
                </button>

            </div>


            <!-- Tap hint -->

            <div
                id="tapHint"
                class="tap-hint"
            >
                <span class="tap-dot"></span>
                Tap the ground to plant
            </div>

        </main>

    </section>


    <script src="script.js"></script>

</body>
</html>
